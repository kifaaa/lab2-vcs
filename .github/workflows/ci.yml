name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore LoggingSystem.slnx

      - name: Build
        run: dotnet build LoggingSystem.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LoggingSystem.slnx --configuration Release --no-build --verbosity normal
